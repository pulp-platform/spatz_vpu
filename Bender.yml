package:
  name: spatz_vpu
  authors:
    - "Matheus Cavalcante <matheusd@iis.ee.ethz.ch>"
    - "Mattia Sinigaglia  <mattia.sinigaglia5@unibo.it>"
    - "Diyou Shen         <dishen@iis.ee.ethz.ch"

dependencies:
  common_cells:       { git: "https://github.com/pulp-platform/common_cells.git",       rev: master             }
  FPnew:              { git: "https://github.com/arpansur/cvfpu.git",                   rev:     0f6caf1dc76eb4f96c388364e35e8bf03ca19625 } # branch: pace-pipe-rebase
  tech_cells_generic: { git: "https://github.com/pulp-platform/tech_cells_generic.git", version: 0.2.14         }
  core_ips:           { git: "https://github.com/colluca/core_ips.git",                 rev: main               }
  reqrsp_interface:   { git: "https://github.com/colluca/reqrsp_interface.git",         rev: main               }

workspace:
  checkout_dir: "hw/ip"

sources:
  ## hw/ip/spatz ##
  - files:
    # Level 0
    - hw/src/spatz_riscv_instr.sv
    - target: mempool
      files:
        - hw/src/reorder_buffer.sv
    - hw/src/rvv_pkg.sv
    # Level 1
    - hw/src/generated/spatz_pkg.sv
    - hw/src/spatz_serdiv.sv
    # Level 2
    - hw/src/spatz_decoder.sv
    - hw/src/spatz_simd_lane.sv
    - hw/src/pace_mem.sv
    - target: fpga
      files:
        - hw/src/vregfile_fpga.sv
    - target: not(fpga)
      files:
        - hw/src/vregfile.sv
    # Level 3
    - hw/src/spatz_fpu_sequencer.sv
    - hw/src/spatz_ipu.sv
    - hw/src/spatz_vfu.sv
    - hw/src/spatz_vlsu.sv
    - hw/src/spatz_doublebw_vlsu.sv
    - hw/src/spatz_vrf.sv
    - hw/src/spatz_vsldu.sv
    # Level 4
    - hw/src/spatz_controller.sv
    # Level 5
    - hw/src/spatz.sv
