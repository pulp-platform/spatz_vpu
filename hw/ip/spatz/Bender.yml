package:
  name: spatz
  authors:
    - "Matheus Cavalcante <matheusd@iis.ee.ethz.ch>"
    - "Mattia Sinigaglia  <mattia.sinigaglia5@unibo.it>"
    - "Diyou Shen         <dishen@iis.ee.ethz.ch"

dependencies:
  common_cells:       { git: "https://github.com/pulp-platform/common_cells.git",       version: 1.28.0         }
  FPnew:              { git: "https://github.com/pulp-platform/cvfpu.git",              rev:     pulp-v0.1.3    }
  tech_cells_generic: { git: "https://github.com/pulp-platform/tech_cells_generic.git", version: 0.2.13         }
  snitch:             { path: "../snitch"                                                                       }
  reqrsp_interface:   { path: "../reqrsp_interface"                                                             }

sources:

  ## hw/ip/spatz ##
  - target: spatz
    files:
    # Level 0
    - ../snitch/src/riscv_instr.sv
    - src/reorder_buffer.sv
    - src/rvv_pkg.sv
    # Level 1
    - src/generated/spatz_pkg.sv
    - src/spatz_serdiv.sv
    # Level 2
    - src/spatz_decoder.sv
    - src/spatz_simd_lane.sv
    - target: fpga
      files:
        - src/vregfile_fpga.sv
    - target: not(fpga)
      files:
        - src/vregfile.sv
    # Level 3
    - src/spatz_fpu_sequencer.sv
    - src/spatz_ipu.sv
    - src/spatz_vfu.sv
    - src/spatz_vlsu.sv
    - src/spatz_vrf.sv
    - src/spatz_vsldu.sv
    # Level 4
    - src/spatz_controller.sv
    # Level 5
    - src/spatz.sv
    # Level 6
    - target: mempool
      files:
      - hw/ip/spatz_cc/src/spatz_mempool_cc.sv
